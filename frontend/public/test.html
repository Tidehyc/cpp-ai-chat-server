<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>连接测试</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
        .status { padding: 15px; margin: 10px 0; border-radius: 8px; font-size: 16px; }
        .connected { background: #d4edda; color: #155724; }
        .disconnected { background: #f8d7da; color: #721c24; }
        .connecting { background: #fff3cd; color: #856404; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; font-size: 14px; }
        #log { background: #f5f5f5; padding: 10px; border-radius: 5px; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <h1>🔌 WebSocket 连接测试</h1>
    <div id="status" class="status connecting">状态：连接中...</div>
    <div>
        <button onclick="testConnection()">🔄 重试连接</button>
        <button onclick="sendTest()">📤 发送测试</button>
        <button onclick="clearLog()">🗑️ 清空日志</button>
    </div>
    <h3>📋 日志</h3>
    <div id="log"></div>

    <script>
        let ws = null;
        const WS_URL = 'ws://127.0.0.1:8081';  // 使用 IPv4 地址
        
        function log(msg, type = 'info') {
            const colors = { info: '#333', success: '#28a745', error: '#dc3545', sent: '#007bff', received: '#6f42c1' };
            document.getElementById('log').innerHTML += `<div style="color: ${colors[type]}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            document.getElementById('log').scrollTop = document.getElementById('log').scrollHeight;
        }

        function updateStatus(status) {
            const el = document.getElementById('status');
            if (status === 'connected') { el.className = 'status connected'; el.textContent = '状态：已连接 ✅'; }
            else if (status === 'disconnected') { el.className = 'status disconnected'; el.textContent = '状态：连接失败 ❌'; }
            else { el.className = 'status connecting'; el.textContent = '状态：连接中...'; }
        }

        function testConnection() {
            if (ws) ws.close();
            
            log('正在连接 ' + WS_URL + '...');
            updateStatus('connecting');
            
            try {
                ws = new WebSocket(WS_URL);
                
                ws.onopen = () => {
                    log('✅ 连接成功!', 'success');
                    updateStatus('connected');
                    log('发送 /help 命令...', 'sent');
                    ws.send('/help');
                };
                
                ws.onmessage = (e) => {
                    log('📩 收到：' + e.data, 'received');
                };
                
                ws.onerror = (e) => {
                    log('❌ 连接错误：' + JSON.stringify(e), 'error');
                    updateStatus('disconnected');
                };
                
                ws.onclose = () => {
                    log('🔌 连接关闭');
                    updateStatus('disconnected');
                };
            } catch (e) {
                log('❌ 异常：' + e.message, 'error');
                updateStatus('disconnected');
            }
        }

        function sendTest() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send('/help');
                log('📤 发送 /help', 'sent');
            } else {
                log('❌ 未连接', 'error');
            }
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        // 页面加载时自动测试
        testConnection();
    </script>
</body>
</html>
