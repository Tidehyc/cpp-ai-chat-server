version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cpp-ai-chat-backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      AI_API_KEY: ${AI_API_KEY}
      AI_API_URL: ${AI_API_URL:-https://api.scnet.cn/api/llm/v1/chat/completions}
      AI_MODEL: ${AI_MODEL:-MiniMax-M2.5}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_PATH: /app/data/chat.db
      LOG_FILE: /app/data/chat_server.log
    volumes:
      - chat_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - chat_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: cpp-ai-chat-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    environment:
      VITE_WS_URL: /ws
    volumes:
      - ./frontend/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - chat_net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: cpp-ai-chat-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      backend:
        condition: service_started
      node-exporter:
        condition: service_started
      blackbox-exporter:
        condition: service_started
      alertmanager:
        condition: service_started
    networks:
      - chat_net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: cpp-ai-chat-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    depends_on:
      feishu-relay:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - chat_net

  feishu-relay:
    image: python:3.11-slim
    container_name: cpp-ai-chat-feishu-relay
    restart: unless-stopped
    command:
      - python
      - /app/scripts/alertmanager_feishu_relay.py
      - --port
      - "8088"
    environment:
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-https://open.feishu.cn/open-apis/bot/v2/hook/3e4e95e8-0233-48b9-83a1-0966420455e2}
    volumes:
      - ./scripts/alertmanager_feishu_relay.py:/app/scripts/alertmanager_feishu_relay.py:ro
    ports:
      - "127.0.0.1:18088:8088"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health').read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - chat_net

  grafana:
    image: grafana/grafana:11.2.2
    container_name: cpp-ai-chat-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me_now}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - chat_net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: cpp-ai-chat-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - chat_net

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: cpp-ai-chat-blackbox
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - chat_net

volumes:
  chat_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  chat_net:
    driver: bridge
