name: CI - 私聊历史、超时、并发验证

on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: '选择测试范围'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - private-history
          - timeout
          - concurrent

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start Docker services
        run: docker compose build && docker compose up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for service to be ready..."
          for i in {1..30}; do
            if nc -z 127.0.0.1 8080 2>/dev/null; then
              echo "Service is ready!"
              exit 0
            fi
            echo "Attempt $i/30, waiting..."
            sleep 2
          done
          echo "Service failed to start"
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Python dependencies
        run: pip install websockets

      - name: Run private history test
        if: ${{ inputs.test_scope == 'all' || inputs.test_scope == 'private-history' }}
        run: python scripts/ci_private_history_test.py

      - name: Run timeout test
        if: ${{ inputs.test_scope == 'all' || inputs.test_scope == 'timeout' }}
        run: python scripts/ci_timeout_test.py

      - name: Run concurrent test
        if: ${{ inputs.test_scope == 'all' || inputs.test_scope == 'concurrent' }}
        run: python scripts/ci_concurrent_test.py

      - name: Show container logs
        if: always()
        run: docker logs $(docker ps --filter "name=chat-server" -q) | tail -50

      - name: Stop services
        if: always()
        run: docker compose down
