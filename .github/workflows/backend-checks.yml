name: backend-checks

on:
  push:
  pull_request:

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libboost-system-dev \
            libsqlite3-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libspdlog-dev \
            nlohmann-json3-dev

      - name: Resolve perf warning gate mode
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          PERF_WARN_RATIO="0.80"
          PERF_WARN_FAIL="0"
          GATE_SOURCE="cli"

          # Strict gate for main branch and PRs targeting main.
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            PERF_WARN_FAIL="1"
            GATE_SOURCE="workflow"
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${GITHUB_BASE_REF}" == "main" ]]; then
            PERF_WARN_FAIL="1"
            GATE_SOURCE="workflow"
          fi

          if [[ "${PERF_WARN_FAIL}" == "1" ]]; then
            GATE_MODE="strict"
          else
            GATE_MODE="warn-only"
          fi

          echo "PERF_WARN_RATIO=${PERF_WARN_RATIO}" >> "$GITHUB_ENV"
          echo "PERF_WARN_FAIL=${PERF_WARN_FAIL}" >> "$GITHUB_ENV"
          echo "GATE_MODE=${GATE_MODE}" >> "$GITHUB_ENV"
          echo "GATE_SOURCE=${GATE_SOURCE}" >> "$GITHUB_ENV"
          echo "Resolved PERF_WARN_FAIL=${PERF_WARN_FAIL} (event=${GITHUB_EVENT_NAME}, ref=${GITHUB_REF}, base_ref=${GITHUB_BASE_REF})"

      - name: Run backend checks
        id: backend_checks
        run: |
          set +e
          bash scripts/run_backend_checks.sh
          exit_code=$?
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"

          category="ok"
          hint="全部检查通过。"
          case "$exit_code" in
            0)
              category="ok"
              hint="全部检查通过。"
              ;;
            11|21)
              category="build"
              hint="先修复构建错误：确认依赖已安装、定位首个编译报错，再重跑脚本。"
              ;;
            31)
              category="test"
              hint="先看失败用例日志，最小化复现后修复，再执行 CTest 回归。"
              ;;
            41)
              category="perf"
              hint="性能基准或汇总失败：检查 benchmark 输出文件和 Python 汇总脚本输入。"
              ;;
            51)
              category="perf-gate"
              hint="性能门禁触发：检查最新 speedup 是否低于阈值，必要时优化 SQL/索引后重测。"
              ;;
            *)
              category="unknown"
              hint="未知失败，请查看 backend-checks 日志首个错误位置。"
              ;;
          esac

          echo "failure_category=${category}" >> "$GITHUB_OUTPUT"
          echo "failure_hint=${hint}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish backend-checks status to job summary
        if: always()
        run: |
          echo "## Backend Checks Status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- PERF_WARN_RATIO: ${{ env.PERF_WARN_RATIO }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- exit_code: ${{ steps.backend_checks.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- category: ${{ steps.backend_checks.outputs.failure_category }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- next_action: ${{ steps.backend_checks.outputs.failure_hint }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- PERF_WARN_FAIL: ${{ env.PERF_WARN_FAIL }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- gate_mode: ${{ env.GATE_MODE }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- gate_source: ${{ env.GATE_SOURCE }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: Show benchmark summary
        if: always()
        run: cat docs/perf_reports/message_history_benchmark_summary.md

      - name: Publish benchmark summary to job summary
        if: always()
        run: |
          if [[ -f docs/perf_reports/message_history_benchmark_summary.md ]]; then
            cat docs/perf_reports/message_history_benchmark_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-reports
          path: |
            docs/perf_reports/*.txt
            docs/perf_reports/message_history_benchmark_summary.md
            docs/perf_reports/message_history_benchmark_summary.csv
          if-no-files-found: warn

      - name: Fail job when backend checks failed
        if: ${{ steps.backend_checks.outputs.exit_code != '0' }}
        run: |
          echo "backend-checks failed: category=${{ steps.backend_checks.outputs.failure_category }}, exit_code=${{ steps.backend_checks.outputs.exit_code }}"
          exit 1

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run secret scan
        id: secret_scan
        run: |
          set +e
          output="$(bash scripts/scan_secrets.sh)"
          exit_code=$?
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$output" | tee secret-scan-report.txt

          status="ok"
          summary="No secret-like patterns found."
          if [[ "$exit_code" -eq 1 ]]; then
            status="warn"
            summary="Potential secret-like matches found; manual review required."
          elif [[ "$exit_code" -ne 0 ]]; then
            status="failed"
            summary="Secret scan execution failed."
          fi

          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "summary=${summary}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish secret scan summary to job summary
        if: always()
        run: |
          echo "## Secret Scan Status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- exit_code: ${{ steps.secret_scan.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- status: ${{ steps.secret_scan.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- summary: ${{ steps.secret_scan.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload secret scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-report
          path: secret-scan-report.txt
          if-no-files-found: warn
