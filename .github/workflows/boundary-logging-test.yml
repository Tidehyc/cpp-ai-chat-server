name: CI - 边界情况与日志验证

on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: '选择测试范围'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - reconnect
          - boundary
          - logging

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Docker services
        run: docker compose up -d

      - name: Wait for services to be ready
        run: sleep 5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Python dependencies
        run: pip install websockets

      - name: Run reconnect test
        if: ${{ inputs.test_scope == 'all' || inputs.test_scope == 'reconnect' }}
        run: python scripts/ci_reconnect_test.py

      - name: Run boundary test
        if: ${{ inputs.test_scope == 'all' || inputs.test_scope == 'boundary' }}
        run: python scripts/ci_boundary_test.py

      - name: Run logging test
        if: ${{ inputs.test_scope == 'all' || inputs.test_scope == 'logging' }}
        run: python scripts/ci_logging_test.py

      - name: Show container logs
        if: always()
        run: docker logs $(docker ps --filter "name=chat-server" -q) | tail -50

      - name: Stop services
        if: always()
        run: docker compose down
