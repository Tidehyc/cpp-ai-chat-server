name: Persistence Test

on:
  workflow_dispatch: {}

jobs:
  persistence:
    name: Validate DB persistence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start services with Docker Compose
        run: |
          docker compose up -d

      - name: Wait for server
        run: |
          # simple wait; adjust if startup is longer
          sleep 5

      - name: Set up Python deps
        run: |
          python3 -m pip install --upgrade pip
          pip install websockets

      - name: Run persistence test
        run: |
          python3 scripts/ci_persistence_test.py
