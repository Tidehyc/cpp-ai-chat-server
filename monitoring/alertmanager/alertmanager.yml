global:
  resolve_timeout: 5m

route:
  receiver: default-log
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    - matchers:
        - severity="critical"
      receiver: webhook-critical
      continue: true
    - matchers:
        - severity="warning"
      receiver: webhook-warning
      continue: true

receivers:
  - name: default-log

  # Alertmanager 先投递到本地 relay，再由 relay 转成飞书机器人消息格式。
  - name: webhook-critical
    webhook_configs:
      - url: "http://feishu-relay:8088/webhook"
        send_resolved: true

  - name: webhook-warning
    webhook_configs:
      - url: "http://feishu-relay:8088/webhook"
        send_resolved: true
