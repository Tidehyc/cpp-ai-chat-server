# C++ AI Chat Server - Docker Compose 配置
# 版本：v0.5.3

version: '3.8'

services:
  # AI 聊天服务器
  chat-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cpp-ai-chat-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # AI API 配置
      - AI_API_KEY=${AI_API_KEY:-your_api_key_here}
      - AI_API_URL=${AI_API_URL:-https://api.scnet.cn/api/llm/v1/chat/completions}
      - AI_MODEL=${AI_MODEL:-MiniMax-M2.5}
      # 服务器配置
      - SERVER_PORT=8080
    volumes:
      # 数据持久化
      - chat_data:/app/data
    networks:
      - chat_network
    healthcheck:
      test: ["CMD", "pgrep", "-x", "chat_server"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 测试客户端（可选）
  test-client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cpp-ai-chat-client
    profiles:
      - test
    depends_on:
      - chat-server
    environment:
      - SERVER_HOST=chat-server
      - SERVER_PORT=8080
    networks:
      - chat_network
    stdin_open: true
    tty: true
    command: ["./ws_client"]

# 数据卷
volumes:
  chat_data:
    driver: local
    name: cpp_ai_chat_data

# 网络
networks:
  chat_network:
    driver: bridge
    name: cpp_ai_chat_network
